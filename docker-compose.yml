services:
  discord-bot:
    build: .
    container_name: ddpybot
    restart: unless-stopped
    volumes:
      - ./data:/app/data                 # 讓資料庫可以永久保存在本機的 data/ 裡
      - ./logs:/app/logs                 # 讓 logs 可以寫出到本機
      - ./setting.json:/app/setting.json # 將本機的設定檔掛載進去
    env_file:
      - .env
    # 資源上限：避免異常時吃光宿主機資源
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    # 控制容器 stdout 日誌大小（bot 自身的 logs/bot.log 另有 5MB 輪替）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
