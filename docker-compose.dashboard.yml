# docker compose -f docker-compose.yml -f docker-compose.dashboard.yml up -d --build
# 先依 README 將 setting.json 複製至 ./data/config/setting.json。
services:
  discord-bot:
    environment:
      DASHBOARD_ENABLED: "true"
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8080"
      SETTING_PATH: /app/data/config/setting.json
    ports:
      - "127.0.0.1:8080:8080"
