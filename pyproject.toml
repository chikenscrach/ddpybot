[project]
name = "ddpybot"
version = "1.0.0"
description = "Discord ㄐㄐ人"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.6.4",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "tzdata>=2024.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "groq>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# 純應用程式專案，不需要打包安裝自身
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
# E501：中文字串常超過行寬限制，逐行硬折反而破壞可讀性
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
